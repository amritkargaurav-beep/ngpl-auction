<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NGPL Auction – Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{font-family:Arial;background:#eef2f7;padding:10px}
.card{background:#fff;padding:12px;margin:10px 0;border-radius:10px}
button,input{width:100%;padding:8px;margin-top:6px}
.bid{font-size:26px;color:green;font-weight:bold;text-align:center}
.team-btn{background:#28a745;color:white;border:none;border-radius:6px;margin-bottom:6px}
</style>
</head>

<body>

<h2>🔐 NGPL Auction – Admin</h2>

<div class="card">
  <input type="file" id="excelFile" accept=".xlsx">
  <button onclick="loadExcel()">Load Players Excel</button>
</div>

<div class="card">
  <h3 id="pname">No Player</h3>
  <p id="prole"></p>
  <div class="bid">₹ <span id="bid">0.0</span> L</div>
  <button onclick="bidUp()">Bid +0.5 L</button>
</div>

<div class="card">
  <button class="team-btn" onclick="sell('MI')">Sell to MI</button>
  <button class="team-btn" onclick="sell('CSK')">Sell to CSK</button>
  <button class="team-btn" onclick="sell('RCB')">Sell to RCB</button>
  <button onclick="markUnsold()">Mark Unsold</button>
</div>

<script>
/* 🔥 FIREBASE CONFIG (PASTE YOURS HERE) */
const firebaseConfig = {
  apiKey: "PASTE_HERE",
  authDomain: "PASTE_HERE",
  databaseURL: "PASTE_HERE",
  projectId: "PASTE_HERE",
  storageBucket: "PASTE_HERE",
  messagingSenderId: "PASTE_HERE",
  appId: "PASTE_HERE"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* STATE */
let players=[], index=0, bid=0;

/* PUSH STATE TO FIREBASE */
function sync(){
  db.ref("auction").set({
    current: players[index] || null,
    bid,
    index
  });
}

/* LOAD EXCEL */
function loadExcel(){
  const f=excelFile.files[0];
  const r=new FileReader();
  r.onload=e=>{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
    players=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
    index=0;
    loadPlayer();
  };
  r.readAsArrayBuffer(f);
}

/* PLAYER */
function loadPlayer(){
  if(index>=players.length) return;
  pname.innerText=players[index].Name;
  prole.innerText=players[index].Role||"";
  bid=Number(players[index].BasePrice)||0;
  bidSpan();
  sync();
}

function bidUp(){ bid+=0.5; bidSpan(); sync(); }
function bidSpan(){ bidEl.innerText=bid.toFixed(1); }
const bidEl=document.getElementById("bid");

/* SELL / UNSOLD */
function sell(team){
  db.ref("sold").push({
    name:players[index].Name,
    team,bid
  });
  index++; loadPlayer();
}

function markUnsold(){
  db.ref("unsold").push(players[index].Name);
  index++; loadPlayer();
}
</script>

</body>
</html>
