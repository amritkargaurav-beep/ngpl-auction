<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NGPL Season 5 Auction – Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
  font-family:Arial;
  padding:10px;
  background-image:url("https://images.unsplash.com/photo-1540747913346-19e32dc3e97e");
  background-size:cover;
  background-attachment:fixed;
}
.card{
  background:rgba(255,255,255,0.95);
  padding:12px;
  margin:10px 0;
  border-radius:10px;
}
button,input{width:100%;padding:8px;margin-top:6px}
.bid{font-size:24px;color:green;font-weight:bold}
.team-btn{background:#28a745;color:white;border:none;border-radius:6px}
.team-btn:disabled{background:#999}
.small{font-size:13px;color:#444}
</style>
</head>

<body>

<h2>🔐 NGPL Season 5 – Admin Auction</h2>

<!-- ADMIN LOGIN -->
<div class="card">
  <button onclick="enterAdmin()">Enter Admin Mode</button>
  <p id="adminStatus" class="small"></p>
</div>

<!-- EXCEL -->
<div class="card admin-only" style="display:none">
  <input type="file" id="excelFile" accept=".xlsx">
  <button onclick="loadExcel()">Load Players Excel</button>
</div>

<!-- PLAYER -->
<div class="card">
  <h3 id="pname">No Player Loaded</h3>
  <p id="prole"></p>
  <div class="bid">₹ <span id="bid">0.0</span> L</div>
  <button class="admin-only" style="display:none" onclick="bidUp()">Bid +0.5 L</button>
</div>

<!-- TEAMS -->
<div class="card admin-only" style="display:none">
  <h3>Teams</h3>
  <div id="teamButtons"></div>
  <button onclick="markUnsold()">Mark Unsold</button>
</div>

<!-- TEAM DETAILS -->
<div class="card">
  <h3>Team Details</h3>
  <div id="teamDetails"></div>
</div>

<div class="card"><h3>Sold Players</h3><ul id="soldList"></ul></div>
<div class="card"><h3>Unsold Players</h3><ul id="unsoldList"></ul></div>

<script>
/* ================= GLOBAL STATE (FIXED ORDER) ================= */
let isAdmin=false;
let players=[];
let index=0;
let bid=0;

const ADMIN_PASSWORD="ngpl2025";

/* ================= TEAMS ================= */
let teams={
 MI:{name:"MI",owner:"Owner A",captain:"Captain A",purse:100,maxBid:0,players:["Owner A","Captain A"]},
 CSK:{name:"CSK",owner:"Owner B",captain:"Captain B",purse:100,maxBid:0,players:["Owner B","Captain B"]},
 RCB:{name:"RCB",owner:"Owner C",captain:"Captain C",purse:100,maxBid:0,players:["Owner C","Captain C"]}
};

/* ================= ADMIN ================= */
function enterAdmin(){
  const p=prompt("Enter Admin Password");
  if(p===ADMIN_PASSWORD){
    isAdmin=true;
    document.querySelectorAll(".admin-only").forEach(e=>e.style.display="block");
    adminStatus.innerText="Admin mode enabled";
  }else{
    alert("Wrong password");
  }
}

/* ================= RENDER ================= */
function renderTeams(){
  teamButtons.innerHTML="";
  teamDetails.innerHTML="";

  for(let t in teams){
    const tm=teams[t];

    teamButtons.innerHTML+=`
      <button class="team-btn" id="btn_${t}" onclick="sell('${t}')">
        ${tm.name} (₹ ${tm.purse.toFixed(1)} L)
      </button>`;

    teamDetails.innerHTML+=`
      <div class="card">
        <b>${tm.name}</b><br>
        Owner: ${tm.owner}<br>
        Captain: ${tm.captain}<br>
        Players (${tm.players.length}/11)
        <ul id="plist_${t}">
          <li>${tm.owner} (Owner)</li>
          <li>${tm.captain} (Captain)</li>
        </ul>
        Highest Buy: ₹ ${tm.maxBid.toFixed(1)} L
      </div>`;
  }
}
renderTeams();

/* ================= EXCEL ================= */
function loadExcel(){
  if(!isAdmin) return;

  const file=document.getElementById("excelFile").files[0];
  if(!file){alert("Select Excel file");return;}

  const reader=new FileReader();
  reader.onload=function(e){
    const data=new Uint8Array(e.target.result);
    const wb=XLSX.read(data,{type:"array"});
    const sheet=wb.Sheets[wb.SheetNames[0]];

    players=XLSX.utils.sheet_to_json(sheet);
    index=0;

    if(players.length===0){
      alert("Excel is empty");
      return;
    }
    loadPlayer();
  };
  reader.readAsArrayBuffer(file);
}

/* ================= PLAYER ================= */
function loadPlayer(){
  if(index>=players.length){
    pname.innerText="Auction Completed";
    bid=0;
    updateBid();
    return;
  }
  pname.innerText=players[index].Name;
  prole.innerText=players[index].Role||"";
  bid=Number(players[index].BasePrice)||0;
  updateBid();
}

function bidUp(){
  if(isAdmin){
    bid+=0.5;
    updateBid();
  }
}

function updateBid(){
  document.getElementById("bid").innerText=bid.toFixed(1);
}

/* ================= SELL ================= */
function sell(t){
  if(!isAdmin) return;

  const tm=teams[t];
  if(tm.players.length>=11){
    alert("Team full");
    return;
  }
  if(tm.purse<bid){
    alert("Insufficient purse");
    return;
  }

  tm.purse-=bid;
  tm.players.push(players[index].Name);
  tm.maxBid=Math.max(tm.maxBid,bid);

  document.getElementById(`plist_${t}`).innerHTML+=
    `<li>${players[index].Name}</li>`;

  soldList.innerHTML+=
    `<li>${players[index].Name} → ${tm.name} (₹ ${bid.toFixed(1)} L)</li>`;

  index++;
  renderTeams();
  loadPlayer();
}

/* ================= UNSOLD ================= */
function markUnsold(){
  if(!isAdmin) return;
  unsoldList.innerHTML+=`<li>${players[index].Name}</li>`;
  index++;
  loadPlayer();
}
</script>

</body>
</html>
