<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NGPL Auction – Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{font-family:Arial;background:#eef2f7;padding:10px}
.card{background:#fff;padding:12px;margin:10px 0;border-radius:10px}
button,input{width:100%;padding:8px;margin-top:6px}
.bid{font-size:26px;color:green;font-weight:bold;text-align:center}
.team-btn{background:#28a745;color:white;border:none;border-radius:6px;margin-bottom:6px}
</style>
</head>

<body>

<h2>🔐 NGPL Auction – Admin</h2>

<div class="card">
  <input type="file" id="excelFile" accept=".xlsx">
  <button id="loadBtn">Load Players Excel</button>
</div>

<div class="card">
  <h3 id="pname">No Player</h3>
  <p id="prole"></p>
  <div class="bid">₹ <span id="bid">0.0</span> L</div>
  <button id="bidBtn">Bid +0.5 L</button>
</div>

<div class="card">
  <button class="team-btn" id="sellMI">Sell to MI</button>
  <button class="team-btn" id="sellCSK">Sell to CSK</button>
  <button class="team-btn" id="sellRCB">Sell to RCB</button>
  <button id="unsoldBtn">Mark Unsold</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  /* ================= SAFE GLOBAL STATE ================= */
  let players = [];
  let index = 0;
  let bid = 0;

  /* ================= FIREBASE ================= */
  const firebaseConfig = {
     apiKey: "AIzaSyDHWCPegKtwhLgJ7OJr9QjayDK1QTf8UP0",
  authDomain: "ngpl-auction.firebaseapp.com",
  databaseURL: "https://ngpl-auction-default-rtdb.firebaseio.com",
  projectId: "ngpl-auction",
  storageBucket: "ngpl-auction.firebasestorage.app",
  messagingSenderId: "80963451556",
  appId: "1:80963451556:web:663f478280a60ab4de8431"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  /* ================= ELEMENTS ================= */
  const pname = document.getElementById("pname");
  const prole = document.getElementById("prole");
  const bidEl = document.getElementById("bid");

  /* ================= SYNC ================= */
  function sync() {
    db.ref("auction").set({
      current: players[index] || null,
      bid,
      index
    });
  }

  /* ================= LOAD PLAYER ================= */
  function loadPlayer() {
    if (index >= players.length) {
      pname.innerText = "Auction Completed";
      bid = 0;
      bidEl.innerText = "0.0";
      sync();
      return;
    }

    const p = players[index];
    pname.innerText = p.Name || "Unnamed";
    prole.innerText = p.Role || "";
    bid = Number(p.BasePrice) || 0;
    bidEl.innerText = bid.toFixed(1);
    sync();
  }

  /* ================= LOAD EXCEL (FIXED) ================= */
  document.getElementById("loadBtn").addEventListener("click", () => {
    const file = document.getElementById("excelFile").files[0];
    if (!file) return alert("Select Excel file");

    const reader = new FileReader();
    reader.onload = (e) => {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      players = XLSX.utils.sheet_to_json(sheet);
      index = 0;
      loadPlayer();
    };
    reader.readAsArrayBuffer(file);
  });

  /* ================= ACTIONS ================= */
  document.getElementById("bidBtn").onclick = () => {
    bid += 0.5;
    bidEl.innerText = bid.toFixed(1);
    sync();
  };

  document.getElementById("sellMI").onclick = () => sell("MI");
  document.getElementById("sellCSK").onclick = () => sell("CSK");
  document.getElementById("sellRCB").onclick = () => sell("RCB");

  document.getElementById("unsoldBtn").onclick = () => {
    if (!players[index]) return;
    db.ref("unsold").push(players[index].Name);
    index++;
    loadPlayer();
  };

  function sell(team) {
    if (!players[index]) return;
    db.ref("sold").push({
      name: players[index].Name,
      team,
      bid
    });
    index++;
    loadPlayer();
  }

});
</script>

</body>
</html>
