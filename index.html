<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NGPL Season 5 Auction</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
  font-family: Arial;
  padding:10px;
  background-image:url("https://images.unsplash.com/photo-1540747913346-19e32dc3e97e");
  background-size:cover;
  background-attachment:fixed;
}

h1,h3{text-align:center;margin:6px 0}

.card{
  background:rgba(255,255,255,0.95);
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  box-shadow:0 4px 8px rgba(0,0,0,.1)
}

.player img{
  width:120px;
  border-radius:50%;
  margin-bottom:10px;
}

.bid{
  font-size:22px;
  color:green;
  font-weight:bold;
}

button,input{
  width:100%;
  padding:8px;
  margin-top:8px;
  font-size:14px;
}

.team-btn{
  background:#28a745;
  color:white;
  border:none;
  border-radius:6px;
  margin-bottom:6px;
  cursor:pointer;
}

.team-btn:disabled{
  background:#999;
}

.team-box{
  border:1px solid #ddd;
  border-radius:8px;
  padding:8px;
  margin:8px 0;
}

.small{font-size:13px;color:#444}

.admin-only{display:none}
</style>
</head>

<body>

<h1>🏏 Nisarg Greens Premier League</h1>
<h3>Season 5 – Auction</h3>

<!-- ADMIN LOGIN -->
<div class="card">
  <button onclick="enterAdmin()">🔐 Enter Admin Mode</button>
  <p id="adminStatus" class="small"></p>
</div>

<!-- EXCEL UPLOAD -->
<div class="card admin-only">
  <input type="file" id="excelFile" accept=".xlsx">
  <button onclick="loadExcel()">Load Players Excel</button>
</div>

<!-- CURRENT PLAYER -->
<div class="card player">
  <h3 id="pname">No Player Loaded</h3>
  <img id="pphoto" style="display:none">
  <p id="prole" class="small"></p>
  <p class="bid">₹ <span id="bid">0.0</span> L</p>
  <button class="admin-only" onclick="bidUp()">Bid +0.5 L</button>
</div>

<!-- TEAMS -->
<div class="card">
  <h3>Teams (Max 11 Players | 1 Cr Purse)</h3>
  <div id="teamButtons" class="admin-only"></div>
  <button class="admin-only" onclick="unsold()">Mark Unsold</button>
</div>

<!-- TEAM DETAILS -->
<div class="card">
  <h3>Team Details</h3>
  <div id="teamDetails"></div>
</div>

<div class="card"><h3>Sold Players</h3><ul id="soldList"></ul></div>
<div class="card"><h3>Unsold Players</h3><ul id="unsoldList"></ul></div>

<script>
/* ================= CONFIG ================= */
const ADMIN_PASSWORD = "ngpl2025";

/* ================= STATE ================= */
let isAdmin=false;
let players=[], index=0, bid=0;

/* ================= TEAMS ================= */
let teams={
  MI:{name:"MI", owner:"Owner A", captain:"Captain A", purse:100, maxBid:0, players:[]},
  KKR:{name:"KKR", owner:"Owner B", captain:"Captain B", purse:100, maxBid:0, players:[]},
  SRH:{name:"SRH", owner:"Owner C", captain:"Captain C", purse:100, maxBid:0, players:[]},
  LSG:{name:"LSG", owner:"Owner D", captain:"Captain D", purse:100, maxBid:0, players:[]},
  GT:{name:"GT", owner:"Owner E", captain:"Captain E", purse:100, maxBid:0, players:[]},
  DC:{name:"DC", owner:"Owner F", captain:"Captain F", purse:100, maxBid:0, players:[]},
  RR:{name:"RR", owner:"Owner G", captain:"Captain G", purse:100, maxBid:0, players:[]},
  PBKS:{name:"PBKS", owner:"Owner H", captain:"Captain H", purse:100, maxBid:0, players:[]},
  RCB:{name:"RCB", owner:"Owner I", captain:"Captain I", purse:100, maxBid:0, players:[]},
  CSK:{name:"CSK", owner:"Owner J", captain:"Captain J", purse:100, maxBid:0, players:[]}
  
};

/* ================= ADMIN MODE ================= */
function enterAdmin(){
  const pass=prompt("Enter Admin Password");
  if(pass===ADMIN_PASSWORD){
    isAdmin=true;
    document.querySelectorAll(".admin-only").forEach(e=>e.style.display="block");
    adminStatus.innerText="Admin Mode Enabled";
  }else{
    alert("Wrong password");
  }
}

/* ================= RENDER TEAMS ================= */
function renderTeams(){
  teamButtons.innerHTML="";
  teamDetails.innerHTML="";

  for(let t in teams){
    const team=teams[t];

    teamButtons.innerHTML+=`
      <button class="team-btn" id="btn_${t}" onclick="sell('${t}')">
        ${team.name} (₹<span id="${t}">${team.purse.toFixed(1)}</span>L)
      </button>`;

    teamDetails.innerHTML+=`
      <div class="team-box">
        <b>${team.name}</b><br>
        <span class="small">Owner: ${team.owner}</span><br>
        <span class="small">Captain: ${team.captain}</span><br>
        <span class="small">
          Players (<span id="count_${t}">${team.players.length}</span>/11)
        </span>
        <ul id="players_${t}"></ul>
        <span class="small">
          Highest Buy: ₹<span id="max_${t}">${team.maxBid.toFixed(1)}</span> L
        </span>
      </div>`;
  }
}
renderTeams();

/* ================= EXCEL ================= */
function loadExcel(){
  if(!isAdmin) return;
  const file=excelFile.files[0];
  if(!file){alert("Select Excel file");return;}

  const reader=new FileReader();
  reader.onload=e=>{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
    players=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
    index=0;
    loadPlayer();
  };
  reader.readAsArrayBuffer(file);
}

/* ================= PLAYER ================= */
function loadPlayer(){
  if(index>=players.length){
    pname.innerText="Auction Completed";
    bid=0;
    bidSpan();
    return;
  }
  const p=players[index];
  pname.innerText=p.Name||"Unnamed";
  prole.innerText=p.Role||"";
  bid=Number(p.BasePrice)||0;
  bidSpan();
}

function bidUp(){
  if(isAdmin){bid+=0.5;bidSpan();}
}

function bidSpan(){
  document.getElementById("bid").innerText=bid.toFixed(1);
}

/* ================= SELL ================= */
function sell(t){
  if(!isAdmin) return;

  const team=teams[t];

  if(team.players.length>=11){
    alert("Team already has 11 players");
    return;
  }
  if(team.purse<bid){
    alert("Not enough purse");
    return;
  }

  team.purse-=bid;
  team.players.push(players[index].Name);
  team.maxBid=Math.max(team.maxBid,bid);

  document.getElementById(t).innerText=team.purse.toFixed(1);
  document.getElementById("players_"+t).innerHTML+=
    `<li>${players[index].Name}</li>`;
  document.getElementById("count_"+t).innerText=team.players.length;
  document.getElementById("max_"+t).innerText=team.maxBid.toFixed(1);

  if(team.players.length>=11){
    document.getElementById("btn_"+t).disabled=true;
  }

  soldList.innerHTML+=
    `<li>${players[index].Name} → ${team.name} (₹${bid.toFixed(1)} L)</li>`;

  index++;
  loadPlayer();
}

/* ================= UNSOLD ================= */
function unsold(){
  if(!isAdmin) return;
  unsoldList.innerHTML+=`<li>${players[index].Name}</li>`;
  index++;
  loadPlayer();
}
</script>

</body>
</html>
