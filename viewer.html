<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NGPL Auction – Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
  padding:20px
}
.card{
  background:#222;
  padding:20px;
  border-radius:12px
}
.bid{
  font-size:48px;
  color:#00ff6a;
  font-weight:bold
}
</style>
</head>

<body>

<h1>🏏 NGPL LIVE AUCTION</h1>

<div class="card">
  <h2 id="pname">Waiting…</h2>
  <p id="prole"></p>
  <div class="bid">₹ <span id="bid">0.0</span> L</div>
</div>

<script>
/* 🔥 SAME FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDHWCPegKtwhLgJ7OJr9QjayDK1QTf8UP0",
  authDomain: "ngpl-auction.firebaseapp.com",
  databaseURL: "https://ngpl-auction-default-rtdb.firebaseio.com",
  projectId: "ngpl-auction",
  storageBucket: "ngpl-auction.firebasestorage.app",
  messagingSenderId: "80963451556",
  appId: "1:80963451556:web:663f478280a60ab4de8431"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* LIVE LISTENER */
db.ref("auction").on("value", snap=>{
  const d=snap.val();
  if(!d || !d.current) return;
  pname.innerText=d.current.Name;
  prole.innerText=d.current.Role||"";
  bid.innerText=d.bid.toFixed(1);
});
</script>

</body>
</html>
